name: Notificaciones ADO a Teams

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ado-notify-teams
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar snapshot
        uses: actions/cache@v4
        with:
          path: ado_teams_state.json
          key: ado-state-${{ github.run_id }}
          restore-keys: |
            ado-state-

      - name: Consultar cambios y notificar
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python notify_ado_teams.py
